<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gfg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1510"/>
      <stop offset="50%" stop-color="#0f2319"/>
      <stop offset="100%" stop-color="#07110c"/>
    </linearGradient>

    <!-- GeeksforGeeks Emerald Neon -->
    <linearGradient id="gfg-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f9d58"/>
      <stop offset="50%" stop-color="#2bb24c"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Metallic Gold -->
    <linearGradient id="gfg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="gfg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="gfg-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 40 20 M 20 0 L 20 40" fill="none" stroke="rgba(43,178,76,0.03)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="850" fill="url(#gfg-bg)"/>
  <rect width="1200" height="850" fill="url(#gfg-pattern)"/>

  <!-- Ornate Outer Border -->
  <rect x="35" y="35" width="1130" height="780" rx="18" fill="none" stroke="url(#gfg-green)" stroke-width="3"/>
  <rect x="48" y="48" width="1104" height="754" rx="14" fill="none" stroke="rgba(43, 178, 76, 0.35)" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="56" y="56" width="1088" height="738" rx="12" fill="none" stroke="rgba(254, 240, 138, 0.2)" stroke-width="1"/>

  <!-- Corner Badges -->
  <g fill="none" stroke="url(#gfg-green)" stroke-width="2">
    <!-- Top-Left -->
    <path d="M 35 75 L 75 75 L 75 35 M 48 90 L 90 90 L 90 48"/>
    <circle cx="90" cy="90" r="4" fill="#2bb24c"/>
    <!-- Top-Right -->
    <path d="M 1165 75 L 1125 75 L 1125 35 M 1152 90 L 1110 90 L 1110 48"/>
    <circle cx="1110" cy="90" r="4" fill="#2bb24c"/>
    <!-- Bottom-Left -->
    <path d="M 35 775 L 75 775 L 75 815 M 48 760 L 90 760 L 90 802"/>
    <circle cx="90" cy="760" r="4" fill="#2bb24c"/>
    <!-- Bottom-Right -->
    <path d="M 1165 775 L 1125 775 L 1125 815 M 1152 760 L 1110 760 L 1110 802"/>
    <circle cx="1110" cy="760" r="4" fill="#2bb24c"/>
  </g>

  <!-- Watermark in Center Background -->
  <g transform="translate(600, 425)" opacity="0.04">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="150" font-weight="900" fill="#2bb24c" text-anchor="middle" dominant-baseline="middle">GFG</text>
  </g>

  <!-- Header Section -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- GFG Double Bracket Graphic -->
    <g transform="translate(-40, -35)">
      <path d="M 10 0 C -5 15, -5 35, 10 50" fill="none" stroke="#2bb24c" stroke-width="6" stroke-linecap="round"/>
      <path d="M 30 0 C 15 15, 15 35, 30 50" fill="none" stroke="#2bb24c" stroke-width="6" stroke-linecap="round"/>
      <path d="M 70 0 C 85 15, 85 35, 70 50" fill="none" stroke="#2bb24c" stroke-width="6" stroke-linecap="round"/>
      <path d="M 50 0 C 65 15, 65 35, 50 50" fill="none" stroke="#2bb24c" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text y="42" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="3">GEEKSFORGEEKS ACADEMY</text>
    <text y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#2bb24c" letter-spacing="5">DATA STRUCTURES &amp; ALGORITHMS CHALLENGE</text>
  </g>

  <!-- Certificate Title -->
  <g transform="translate(600, 240)" text-anchor="middle">
    <text font-family="'Playfair Display', Georgia, serif" font-size="34" font-style="italic" fill="url(#gfg-gold)" font-weight="700" letter-spacing="2">Certificate of Algorithmic Achievement</text>
    <line x1="-200" y1="18" x2="200" y2="18" stroke="url(#gfg-green)" stroke-width="1.5"/>
    <circle cx="0" cy="18" r="4" fill="#2bb24c"/>
  </g>

  <!-- Presentation Clause -->
  <g transform="translate(600, 305)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="3">AWARDED TO CAMPUS MANTRI &amp; JAVA PROGRAMMER</text>
  </g>

  <!-- Recipient Name -->
  <g transform="translate(600, 365)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="2">AYUSH RAWAT</text>
    <text y="24" font-family="monospace" font-size="14" font-weight="700" fill="#2bb24c">BTech CSE • MVIET Chapter</text>
    <line x1="-240" y1="36" x2="240" y2="36" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>

  <!-- Citation Text -->
  <g transform="translate(600, 440)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="400" fill="#d1fae5" line-height="24">
      <tspan x="0" dy="0">In recognition of successful problem solving in the 160 Days DSA Challenge and exemplary leadership</tspan>
      <tspan x="0" dy="24">as GeeksforGeeks Campus Mantri at MVIET, fostering student developer culture and mastering core</tspan>
      <tspan x="0" dy="24">Java Algorithms, Object-Oriented System Design, Recursion, and Advanced Data Structures.</tspan>
    </text>
  </g>

  <!-- Competencies Badges Row -->
  <g transform="translate(600, 535)" text-anchor="middle">
    <g transform="translate(-270, 0)">
      <rect width="125" height="28" rx="14" fill="rgba(43, 178, 76, 0.15)" stroke="#2bb24c" stroke-width="1"/>
      <text x="62" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">160 Days DSA</text>
    </g>
    <g transform="translate(-130, 0)">
      <rect width="120" height="28" rx="14" fill="rgba(43, 178, 76, 0.15)" stroke="#2bb24c" stroke-width="1"/>
      <text x="60" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">Java OOP &amp; DSA</text>
    </g>
    <g transform="translate(5, 0)">
      <rect width="120" height="28" rx="14" fill="rgba(43, 178, 76, 0.15)" stroke="#2bb24c" stroke-width="1"/>
      <text x="60" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">Recursion / Trees</text>
    </g>
    <g transform="translate(140, 0)">
      <rect width="130" height="28" rx="14" fill="rgba(43, 178, 76, 0.15)" stroke="#2bb24c" stroke-width="1"/>
      <text x="65" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">Campus Leadership</text>
    </g>
  </g>

  <!-- Official Medal & Seal -->
  <g transform="translate(600, 680)" filter="url(#gfg-glow)">
    <path d="M -22 25 L -35 75 L -10 65 L 0 75 L 0 25 Z" fill="#065f46"/>
    <path d="M 22 25 L 35 75 L 10 65 L 0 75 L 0 25 Z" fill="#2bb24c"/>
    <circle cx="0" cy="0" r="48" fill="url(#gfg-gold)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="#0a1510" stroke="url(#gfg-green)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="rgba(43,178,76,0.4)" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="0" y="-8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="900" fill="#2bb24c" text-anchor="middle">GFG MVIET</text>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">CERTIFIED</text>
    <text x="0" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#34d399" text-anchor="middle">★ MANTRI ★</text>
  </g>

  <!-- Left Signatory: GFG Community Lead -->
  <g transform="translate(240, 685)" text-anchor="center">
    <path d="M 0 -15 Q 35 -38, 70 -8 T 130 -32 T 170 -6" fill="none" stroke="#2bb24c" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="5" x2="190" y2="5" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="85" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Sandeep Jain</text>
    <text x="85" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#9ca3af" text-anchor="middle">Founder &amp; CEO, GeeksforGeeks</text>
  </g>

  <!-- Right Signatory: Chapter Head -->
  <g transform="translate(800, 685)" text-anchor="center">
    <path d="M 0 -10 Q 40 -35, 75 -5 T 135 -28 T 175 -8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="5" x2="190" y2="5" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="85" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Campus Mentorship Cell</text>
    <text x="85" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#9ca3af" text-anchor="middle">GeeksforGeeks Student Programs</text>
  </g>

  <!-- Footer Verification Metadata Bar -->
  <g transform="translate(600, 785)" text-anchor="middle">
    <text font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="1">
      CREDENTIAL ID: GFG-DSA-JAVA-2025-MVIET  •  VERIFIED AT: geeksforgeeks.org/verify  •  STATUS: VERIFIED
    </text>
  </g>
</svg>

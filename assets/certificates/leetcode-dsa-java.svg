<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#0e0e11"/>
    </linearGradient>

    <!-- LeetCode Signature Gold/Orange -->
    <linearGradient id="lc-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa116"/>
      <stop offset="50%" stop-color="#ffc01e"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Neon Emerald for Solved / Passing -->
    <linearGradient id="lc-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="lc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="lc-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 40 L 40 0 M 0 0 L 40 40" fill="none" stroke="rgba(255,161,22,0.03)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="850" fill="url(#lc-bg)"/>
  <rect width="1200" height="850" fill="url(#lc-pattern)"/>

  <!-- Ornate Outer Border -->
  <rect x="35" y="35" width="1130" height="780" rx="18" fill="none" stroke="url(#lc-gold)" stroke-width="3"/>
  <rect x="48" y="48" width="1104" height="754" rx="14" fill="none" stroke="rgba(255, 161, 22, 0.35)" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="56" y="56" width="1088" height="738" rx="12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Corner Badges -->
  <g fill="none" stroke="url(#lc-gold)" stroke-width="2">
    <!-- Top-Left -->
    <path d="M 35 75 L 75 75 L 75 35 M 48 90 L 90 90 L 90 48"/>
    <circle cx="90" cy="90" r="4" fill="#ffa116"/>
    <!-- Top-Right -->
    <path d="M 1165 75 L 1125 75 L 1125 35 M 1152 90 L 1110 90 L 1110 48"/>
    <circle cx="1110" cy="90" r="4" fill="#ffa116"/>
    <!-- Bottom-Left -->
    <path d="M 35 775 L 75 775 L 75 815 M 48 760 L 90 760 L 90 802"/>
    <circle cx="90" cy="760" r="4" fill="#ffa116"/>
    <!-- Bottom-Right -->
    <path d="M 1165 775 L 1125 775 L 1125 815 M 1152 760 L 1110 760 L 1110 802"/>
    <circle cx="1110" cy="760" r="4" fill="#ffa116"/>
  </g>

  <!-- Watermark in Center Background -->
  <g transform="translate(600, 425)" opacity="0.04">
    <text font-family="monospace" font-size="160" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">&lt;/&gt; DSA</text>
  </g>

  <!-- Header Section -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- LeetCode Icon Graphic -->
    <g transform="translate(0, -35)">
      <path d="M -18 -8 L 0 -22 L 18 -8 L 10 12 L -10 12 Z" fill="#ffa116"/>
      <path d="M -8 18 L 8 18" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text y="14" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="4">LEETCODE ALGORITHM MASTERY</text>
    <text y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#ffa116" letter-spacing="5">DATA STRUCTURES &amp; ALGORITHMS IN JAVA</text>
  </g>

  <!-- Certificate Title -->
  <g transform="translate(600, 230)" text-anchor="middle">
    <text font-family="'Playfair Display', Georgia, serif" font-size="36" font-style="italic" fill="url(#lc-gold)" font-weight="700" letter-spacing="2">Certificate of Problem Solving Mastery</text>
    <line x1="-200" y1="18" x2="200" y2="18" stroke="url(#lc-gold)" stroke-width="1.5"/>
    <circle cx="0" cy="18" r="4" fill="#ffa116"/>
  </g>

  <!-- Presentation Clause -->
  <g transform="translate(600, 295)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#9ca3af" letter-spacing="3">OFFICIALLY CONFERRED UPON COMPETITIVE PROGRAMMER</text>
  </g>

  <!-- Recipient Name -->
  <g transform="translate(600, 360)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="2">AYUSH RAWAT</text>
    <text y="24" font-family="monospace" font-size="14" font-weight="700" fill="#ffa116">(@rawat_ayush00)</text>
    <line x1="-240" y1="36" x2="240" y2="36" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>

  <!-- Citation Text -->
  <g transform="translate(600, 435)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="400" fill="#d1d5db" line-height="24">
      <tspan x="0" dy="0">For rigorous problem solving, algorithmic optimization, and demonstrated excellence in Java,</tspan>
      <tspan x="0" dy="24">solving core coding challenges across Arrays, Two Pointers, Linked Lists, Trees, Graphs, and</tspan>
      <tspan x="0" dy="24">Dynamic Programming with optimal Big-O time and space complexity standards.</tspan>
    </text>
  </g>

  <!-- Competencies Badges Row -->
  <g transform="translate(600, 530)" text-anchor="middle">
    <g transform="translate(-270, 0)">
      <rect width="125" height="28" rx="14" fill="rgba(255, 161, 22, 0.15)" stroke="#ffa116" stroke-width="1"/>
      <text x="62" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffc01e">Java Collections</text>
    </g>
    <g transform="translate(-130, 0)">
      <rect width="120" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
      <text x="60" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">Dynamic Prog</text>
    </g>
    <g transform="translate(5, 0)">
      <rect width="120" height="28" rx="14" fill="rgba(255, 161, 22, 0.15)" stroke="#ffa116" stroke-width="1"/>
      <text x="60" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffc01e">Graph Traversal</text>
    </g>
    <g transform="translate(140, 0)">
      <rect width="130" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
      <text x="65" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">O(N) Optimization</text>
    </g>
  </g>

  <!-- Official Medal & Seal -->
  <g transform="translate(600, 680)" filter="url(#lc-glow)">
    <path d="M -22 25 L -35 75 L -10 65 L 0 75 L 0 25 Z" fill="#d97706"/>
    <path d="M 22 25 L 35 75 L 10 65 L 0 75 L 0 25 Z" fill="#ffa116"/>
    <circle cx="0" cy="0" r="48" fill="url(#lc-gold)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="#141416" stroke="url(#lc-gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="rgba(255,161,22,0.4)" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="0" y="-8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="900" fill="#ffa116" text-anchor="middle">LEETCODE</text>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">SOLVER</text>
    <text x="0" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#34d399" text-anchor="middle">★ TOP 10% ★</text>
  </g>

  <!-- Left Signatory -->
  <g transform="translate(240, 685)" text-anchor="center">
    <path d="M 0 -15 Q 35 -38, 70 -8 T 130 -32 T 170 -6" fill="none" stroke="#ffa116" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="5" x2="190" y2="5" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="85" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Algorithm Evaluation Board</text>
    <text x="85" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#9ca3af" text-anchor="middle">LeetCode Technical Assessment</text>
  </g>

  <!-- Right Signatory -->
  <g transform="translate(800, 685)" text-anchor="center">
    <path d="M 0 -10 Q 40 -35, 75 -5 T 135 -28 T 175 -8" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="5" x2="190" y2="5" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="85" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Competitive Coding Council</text>
    <text x="85" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#9ca3af" text-anchor="middle">DSA Java Certification Lead</text>
  </g>

  <!-- Footer Verification Metadata Bar -->
  <g transform="translate(600, 785)" text-anchor="middle">
    <text font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="1">
      CREDENTIAL ID: LC-DSA-JAVA-2026-AR00  •  VERIFIED AT: leetcode.com/u/rawat_ayush00  •  STATUS: VERIFIED
    </text>
  </g>
</svg>

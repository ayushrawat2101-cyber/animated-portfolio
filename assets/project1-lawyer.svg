<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfcfb8"/>
      <stop offset="100%" stop-color="#c9b79d"/>
    </linearGradient>
    <linearGradient id="p1-screen-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181716"/>
      <stop offset="100%" stop-color="#2a2520"/>
    </linearGradient>
    <linearGradient id="p1-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e5a93b"/>
      <stop offset="100%" stop-color="#f5ce75"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="600" rx="28" fill="url(#p1-bg)"/>

  <!-- Serif Watermark -->
  <text x="50" y="140" font-family="'Playfair Display', Georgia, serif" font-size="140" font-weight="800" fill="rgba(255,255,255,0.4)" letter-spacing="-2">Lawyer</text>

  <!-- Monitor Stand -->
  <rect x="365" y="490" width="70" height="70" rx="8" fill="#1b1d20"/>
  <rect x="310" y="555" width="180" height="14" rx="7" fill="#2d3035"/>

  <!-- Monitor Screen Outer Frame -->
  <rect x="110" y="125" width="580" height="375" rx="18" fill="#111315" stroke="#33383e" stroke-width="3" filter="url(#shadow)"/>

  <!-- Screen Content -->
  <g transform="translate(125, 140)">
    <rect width="550" height="345" rx="10" fill="url(#p1-screen-bg)"/>

    <!-- Screen Navbar -->
    <text x="30" y="38" font-family="sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="2">ALEXANDER &amp; CO.</text>
    <g fill="#9b958c" font-family="sans-serif" font-size="11" font-weight="500">
      <text x="240" y="38">Practice</text>
      <text x="310" y="38">Attorneys</text>
      <text x="385" y="38">About</text>
    </g>
    <rect x="445" y="22" width="85" height="26" rx="13" fill="url(#p1-gold)"/>
    <text x="462" y="39" font-family="sans-serif" font-size="10" font-weight="700" fill="#1a1409">Consult ↗</text>

    <!-- Hero Content on Screen -->
    <text x="30" y="95" font-family="sans-serif" font-size="11" font-weight="700" fill="#e5a93b" letter-spacing="1.5">TRUSTED LEGAL DEFENSE</text>
    <text x="30" y="130" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#ffffff">Your Trusted</text>
    <text x="30" y="165" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#ffffff">Legal Counselor</text>
    <text x="30" y="195" font-family="sans-serif" font-size="11" fill="#a8a29e">30+ Years of uncompromising excellence in corporate &amp; civil advocacy.</text>

    <!-- CTAs on Screen -->
    <rect x="30" y="215" width="110" height="32" rx="16" fill="url(#p1-gold)"/>
    <text x="50" y="235" font-family="sans-serif" font-size="11" font-weight="700" fill="#181308">Book Case ↗</text>

    <!-- Lawyer Portrait Vector Graphics -->
    <g transform="translate(340, 80)">
      <!-- Backdrop glow -->
      <circle cx="110" cy="110" r="100" fill="#e5a93b" opacity="0.15"/>
      <!-- Body / Suit -->
      <path d="M40 240 C50 180, 80 160, 110 160 C140 160, 170 180, 180 240 Z" fill="#1f2329"/>
      <path d="M95 160 L110 205 L125 160 Z" fill="#ffffff"/>
      <path d="M106 180 L110 230 L114 180 Z" fill="#a82d2d"/>
      <!-- Head / Face -->
      <ellipse cx="110" cy="110" rx="35" ry="42" fill="#d99f7d"/>
      <!-- Hair -->
      <path d="M75 98 C75 65, 145 65, 145 98 C135 80, 85 80, 75 98 Z" fill="#4a3b32"/>
      <!-- Glasses -->
      <rect x="88" y="100" width="18" height="10" rx="2" fill="none" stroke="#222" stroke-width="2"/>
      <rect x="114" y="100" width="18" height="10" rx="2" fill="none" stroke="#222" stroke-width="2"/>
      <line x1="106" y1="105" x2="114" y2="105" stroke="#222" stroke-width="2"/>
      <!-- Gavel symbol -->
      <g transform="translate(170, 170) rotate(-35)">
        <rect x="0" y="0" width="14" height="28" rx="3" fill="#8d5b2f"/>
        <rect x="4" y="10" width="40" height="7" rx="2" fill="#d49e58"/>
      </g>
    </g>

    <!-- Big Lawyer Watermark on page -->
    <text x="30" y="325" font-family="'Playfair Display', Georgia, serif" font-size="46" font-weight="800" fill="rgba(255,255,255,0.85)">Alexander</text>

    <!-- Stat badge -->
    <rect x="420" y="125" width="95" height="52" rx="10" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.1)"/>
    <text x="435" y="150" font-family="sans-serif" font-size="18" font-weight="800" fill="#e5a93b">15K+</text>
    <text x="435" y="167" font-family="sans-serif" font-size="9" fill="#cccccc">CASES WON</text>
  </g>
</svg>

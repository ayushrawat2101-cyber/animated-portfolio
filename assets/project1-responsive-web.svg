<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="p1-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow-web" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="600" rx="28" fill="url(#p1-bg)"/>

  <!-- Watermark -->
  <text x="40" y="130" font-family="'Anton', sans-serif" font-size="120" font-weight="900" fill="rgba(255,255,255,0.04)" letter-spacing="2">RESPONSIVE</text>

  <!-- Multi-Device Mockup: Desktop + Mobile -->
  <!-- Desktop Screen -->
  <g transform="translate(60, 80)" filter="url(#shadow-web)">
    <rect width="520" height="340" rx="16" fill="#181a22" stroke="#2d323f" stroke-width="2.5"/>
    
    <!-- Window Bar -->
    <rect width="520" height="32" rx="16" fill="#12131a"/>
    <circle cx="20" cy="16" r="5" fill="#ef4444"/>
    <circle cx="36" cy="16" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="16" r="5" fill="#10b981"/>
    <rect x="140" y="7" width="240" height="18" rx="9" fill="#1e212b"/>
    <text x="260" y="20" font-family="monospace" font-size="9" fill="#71717a" text-anchor="middle">www.3skillplatform.com</text>

    <!-- Web Page UI -->
    <g transform="translate(20, 48)">
      <!-- Navbar -->
      <text x="0" y="20" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">3 SKILL PLATFORM</text>
      <text x="320" y="20" font-family="sans-serif" font-size="10" fill="#a1a1aa">Home • Projects • About</text>
      <rect x="400" y="7" width="60" height="20" rx="10" fill="url(#p1-accent)"/>
      <text x="414" y="21" font-family="sans-serif" font-size="9" font-weight="700" fill="#121212">Explore</text>

      <!-- Hero Header -->
      <g transform="translate(0, 45)">
        <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#ffffff">NEXT-GEN RESPONSIVE</text>
        <text x="0" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#f97316">WEB INTERFACE</text>
        <text x="0" y="75" font-family="sans-serif" font-size="10" fill="#9ca3af">Engineered during 3 Skill Platform Web Dev Internship with React &amp; Tailwind CSS.</text>

        <!-- Metrics cards -->
        <g transform="translate(0, 95)">
          <rect width="130" height="65" rx="10" fill="#1e212b" stroke="rgba(255,255,255,0.08)"/>
          <text x="14" y="28" font-family="sans-serif" font-size="16" font-weight="800" fill="#38bdf8">100%</text>
          <text x="14" y="48" font-family="sans-serif" font-size="9" fill="#9ca3af">LIGHTHOUSE SCORE</text>

          <rect x="145" y="0" width="130" height="65" rx="10" fill="#1e212b" stroke="rgba(255,255,255,0.08)"/>
          <text x="159" y="28" font-family="sans-serif" font-size="16" font-weight="800" fill="#10b981">MULTI-DEVICE</text>
          <text x="159" y="48" font-family="sans-serif" font-size="9" fill="#9ca3af">FLUID BREAKPOINTS</text>
        </g>
      </g>
    </g>

    <!-- Stand -->
    <rect x="235" y="340" width="50" height="40" fill="#181a22"/>
    <rect x="195" y="375" width="130" height="10" rx="5" fill="#2d323f"/>
  </g>

  <!-- Floating Mobile Mockup Overlapping -->
  <g transform="translate(490, 160)" filter="url(#shadow-web)">
    <rect width="220" height="380" rx="34" fill="#0b0d13" stroke="#f97316" stroke-width="3"/>
    <rect x="8" y="8" width="204" height="364" rx="26" fill="#141722"/>
    <rect x="75" y="14" width="70" height="16" rx="8" fill="#000000"/>

    <g transform="translate(20, 48)">
      <text x="0" y="16" font-family="sans-serif" font-size="10" font-weight="800" fill="#f97316">MOBILE VIEW</text>
      <text x="0" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#ffffff">Adaptive Layout</text>
      <rect x="0" y="52" width="164" height="60" rx="8" fill="#1e2230"/>
      <rect x="10" y="62" width="40" height="40" rx="6" fill="#38bdf8" opacity="0.3"/>
      <text x="60" y="78" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">3 Skill Projects</text>
      <text x="60" y="94" font-family="sans-serif" font-size="8" fill="#9ca3af">Touch Optimized</text>

      <rect x="0" y="124" width="164" height="80" rx="8" fill="#1e2230"/>
      <text x="12" y="148" font-family="sans-serif" font-size="11" font-weight="700" fill="#f97316">⚡ Instant Load</text>
      <text x="12" y="166" font-family="sans-serif" font-size="8" fill="#9ca3af">Zero Layout Shift</text>
      <rect x="12" y="178" width="140" height="14" rx="7" fill="url(#p1-accent)"/>
    </g>
  </g>
</svg>

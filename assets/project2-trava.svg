<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaedf2"/>
      <stop offset="100%" stop-color="#d4dbe4"/>
    </linearGradient>
    <linearGradient id="p2-phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4f9"/>
    </linearGradient>
    <linearGradient id="p2-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow2" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="600" rx="28" fill="url(#p2-bg)"/>

  <!-- Giant Trava Watermark -->
  <text x="50" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="160" font-weight="900" fill="#3b82f6" opacity="0.2" letter-spacing="-4">Trava</text>

  <!-- Holding Hand Silhouette/Art -->
  <g transform="translate(180, 220)">
    <!-- Arm / Wrist -->
    <path d="M120 380 C110 300, 140 240, 190 200 C240 180, 280 230, 290 380 Z" fill="#d2987a" opacity="0.95"/>
    <!-- Fingers gripping phone edge -->
    <path d="M150 160 C130 170, 120 200, 145 220 C165 230, 190 210, 180 180 Z" fill="#c08669"/>
    <path d="M360 170 C380 185, 385 220, 360 240 C340 250, 320 230, 330 190 Z" fill="#c08669"/>
  </g>

  <!-- Smartphone Mockup -->
  <g transform="translate(260, 60)" filter="url(#shadow2)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="280" height="490" rx="42" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    <!-- Screen Glass -->
    <rect x="10" y="10" width="260" height="470" rx="34" fill="url(#p2-phone)"/>

    <!-- Dynamic Island / Notch -->
    <rect x="95" y="20" width="90" height="24" rx="12" fill="#0f172a"/>

    <!-- App Content Inside Phone -->
    <g transform="translate(25, 60)">
      <!-- App Header -->
      <text x="0" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#2563eb" letter-spacing="1">KEYPHARMA TRAVA</text>
      <circle cx="215" cy="16" r="14" fill="#e2e8f0"/>
      <circle cx="215" cy="13" r="5" fill="#94a3b8"/>
      <path d="M205 27 C207 20, 223 20, 225 27 Z" fill="#94a3b8"/>

      <text x="0" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Smart Care &amp;</text>
      <text x="0" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Pocket Relief</text>

      <!-- Search Bar -->
      <rect x="0" y="100" width="230" height="38" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
      <text x="35" y="124" font-family="sans-serif" font-size="11" fill="#94a3b8">Search health solutions...</text>
      <circle cx="20" cy="119" r="5" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
      <line x1="24" y1="123" x2="28" y2="127" stroke="#94a3b8" stroke-width="1.8"/>

      <!-- Featured Product Card -->
      <rect x="0" y="152" width="230" height="150" rx="18" fill="#ffffff" filter="drop-shadow(0px 8px 16px rgba(37,99,235,0.08))"/>
      <rect x="12" y="164" width="70" height="60" rx="10" fill="#eff6ff"/>
      <!-- Pill bottle icon -->
      <rect x="37" y="176" width="20" height="34" rx="4" fill="#3b82f6"/>
      <rect x="33" y="172" width="28" height="6" rx="2" fill="#1d4ed8"/>
      <rect x="37" y="188" width="20" height="10" fill="#ffffff"/>

      <text x="94" y="185" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Trava Relief Pack</text>
      <text x="94" y="202" font-family="sans-serif" font-size="10" fill="#64748b">Instant travel medical kit</text>
      <text x="94" y="222" font-family="sans-serif" font-size="14" font-weight="800" fill="#2563eb">$29.99</text>

      <rect x="12" y="248" width="206" height="36" rx="12" fill="url(#p2-blue)"/>
      <text x="75" y="271" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">One-Click Order ↗</text>

      <!-- Fast delivery badge -->
      <rect x="0" y="318" width="230" height="50" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="16" y="340" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">⚡ 2-Hour Express Delivery</text>
      <text x="16" y="356" font-family="sans-serif" font-size="9" fill="#64748b">Available in 42 metropolitan cities</text>
    </g>
  </g>

  <!-- Big Floating Action Pill with Arrow (Matches Screenshot!) -->
  <g transform="translate(620, 390)">
    <circle cx="45" cy="45" r="45" fill="#1e1e24" filter="url(#shadow2)"/>
    <!-- Diagonal Arrow ↗ -->
    <path d="M35 55 L55 35 M40 35 L55 35 L55 50" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

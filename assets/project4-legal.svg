<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22252a"/>
      <stop offset="100%" stop-color="#141518"/>
    </linearGradient>
    <linearGradient id="p4-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#1c1f24"/>
    </linearGradient>
    <linearGradient id="p4-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="600" rx="28" fill="url(#p4-bg)"/>

  <!-- Serif Watermark -->
  <text x="60" y="130" font-family="'Playfair Display', Georgia, serif" font-size="130" font-weight="800" fill="rgba(255,255,255,0.08)" letter-spacing="-2">Lawyer</text>

  <!-- Hands Holding Tablet -->
  <!-- Left Hand -->
  <g fill="#1a1c20" opacity="0.9">
    <path d="M40 380 C60 280, 100 240, 130 220 L150 440 Z"/>
    <path d="M125 210 C135 190, 155 190, 160 215 C165 240, 140 260, 125 250 Z"/>
  </g>
  <!-- Right Hand -->
  <g fill="#1a1c20" opacity="0.9">
    <path d="M760 380 C740 280, 700 240, 670 220 L650 440 Z"/>
    <path d="M675 210 C665 190, 645 190, 640 215 C635 240, 660 260, 675 250 Z"/>
  </g>

  <!-- Tablet Frame -->
  <g transform="translate(130, 90)" filter="url(#shadow4)">
    <rect width="540" height="380" rx="24" fill="#090a0c" stroke="#33373d" stroke-width="4"/>
    <circle cx="270" cy="14" r="3" fill="#4b5563"/>

    <!-- Tablet Screen -->
    <g transform="translate(18, 26)">
      <rect width="504" height="328" rx="14" fill="url(#p4-screen)"/>

      <!-- Tablet Web Page Header -->
      <text x="24" y="28" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1.5">ROBERT'S LEGAL</text>
      <g fill="#9ca3af" font-family="sans-serif" font-size="10" font-weight="500">
        <text x="210" y="28">Services</text>
        <text x="270" y="28">About</text>
        <text x="325" y="28">Reviews</text>
      </g>
      <rect x="390" y="14" width="90" height="22" rx="11" fill="url(#p4-gold)"/>
      <text x="408" y="29" font-family="sans-serif" font-size="9" font-weight="700" fill="#181308">Free Case Check</text>

      <!-- Web Page Hero Content -->
      <g transform="translate(24, 60)">
        <text x="0" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b" letter-spacing="1">PREMIER LITIGATION</text>
        <text x="0" y="50" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#ffffff">When Sound</text>
        <text x="0" y="78" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#ffffff">Legal Advice</text>
        <text x="0" y="106" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#ffffff">Matters Most</text>

        <rect x="0" y="130" width="110" height="28" rx="14" fill="url(#p4-gold)"/>
        <text x="20" y="148" font-family="sans-serif" font-size="10" font-weight="700" fill="#181308">Schedule Call ↗</text>
      </g>

      <!-- Lawyer Photo Vector Graphic -->
      <g transform="translate(290, 45)">
        <ellipse cx="100" cy="115" rx="85" ry="95" fill="#f59e0b" opacity="0.1"/>
        <!-- Suit -->
        <path d="M40 220 C50 160, 80 150, 100 150 C120 150, 150 160, 160 220 Z" fill="#2d333b"/>
        <path d="M88 150 L100 190 L112 150 Z" fill="#ffffff"/>
        <!-- Head -->
        <ellipse cx="100" cy="100" rx="34" ry="40" fill="#dfad89"/>
        <!-- Hair -->
        <path d="M68 90 C68 60, 132 60, 132 90 C122 75, 78 75, 68 90 Z" fill="#3a2f28"/>
        <!-- Glasses -->
        <rect x="78" y="92" width="18" height="11" rx="2" fill="none" stroke="#e5e7eb" stroke-width="2"/>
        <rect x="104" y="92" width="18" height="11" rx="2" fill="none" stroke="#e5e7eb" stroke-width="2"/>
        <line x1="96" y1="97" x2="104" y2="97" stroke="#e5e7eb" stroke-width="2"/>
      </g>
    </g>
  </g>

  <!-- Big Floating Action Pill with Circular Icon (Matches Screenshot!) -->
  <g transform="translate(620, 390)">
    <circle cx="45" cy="45" r="45" fill="#2a2c32" filter="url(#shadow4)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <!-- Circular refresh / expand symbol -->
    <circle cx="45" cy="45" r="18" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="85 30"/>
    <path d="M57 33 L64 33 L64 26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="v4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181820"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="v4-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow-phone" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="600" rx="28" fill="url(#v4-bg)"/>

  <!-- Watermark -->
  <text x="60" y="140" font-family="'Anton', sans-serif" font-size="130" font-weight="900" fill="rgba(255,255,255,0.05)" letter-spacing="4">REELS</text>

  <!-- Smartphone Mockup Centered for Vertical Video Edit -->
  <g transform="translate(260, 45)" filter="url(#shadow-phone)">
    <!-- Phone Outer Body -->
    <rect width="280" height="510" rx="42" fill="#090a0f" stroke="#374151" stroke-width="4"/>
    
    <!-- Screen Glass -->
    <rect x="10" y="10" width="260" height="490" rx="34" fill="url(#v4-screen)"/>

    <!-- Dynamic Island -->
    <rect x="95" y="18" width="90" height="24" rx="12" fill="#000000"/>

    <!-- Video Reel Content -->
    <g transform="translate(20, 60)">
      <!-- Creator Badge -->
      <circle cx="20" cy="20" r="14" fill="#f97316"/>
      <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">AR</text>
      <text x="42" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">@ayushrawat.edits</text>
      <text x="42" y="32" font-family="sans-serif" font-size="9" fill="#a5b4fc">Trending Audio • Original Mix</text>

      <!-- Video Visual Element (Neon Gradient Circles / Motion Art) -->
      <circle cx="110" cy="140" r="65" fill="#f43f5e" opacity="0.4" filter="blur(20px)"/>
      <circle cx="150" cy="190" r="50" fill="#6366f1" opacity="0.6" filter="blur(15px)"/>
      <polygon points="120,110 145,150 95,150" fill="#fbbf24"/>

      <!-- Big Bold Kinetic Subtitle (Viral Reel Style) -->
      <g transform="translate(0, 240)">
        <rect x="0" y="0" width="220" height="38" rx="8" fill="rgba(0,0,0,0.85)"/>
        <text x="110" y="26" font-family="'Anton', sans-serif" font-size="20" fill="#fbbf24" text-anchor="middle" letter-spacing="1">
          HOW I BUILT THIS IN 24H ⚡
        </text>

        <rect x="15" y="46" width="190" height="30" rx="6" fill="#f97316"/>
        <text x="110" y="67" font-family="'Anton', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">
          FRONTEND + 4K EDIT
        </text>
      </g>

      <!-- Audio Visualizer Waveform -->
      <g transform="translate(10, 360)">
        <rect x="0" y="12" width="6" height="16" rx="3" fill="#38bdf8"/>
        <rect x="12" y="4" width="6" height="32" rx="3" fill="#38bdf8"/>
        <rect x="24" y="0" width="6" height="40" rx="3" fill="#fbbf24"/>
        <rect x="36" y="8" width="6" height="24" rx="3" fill="#fbbf24"/>
        <rect x="48" y="2" width="6" height="36" rx="3" fill="#f43f5e"/>
        <rect x="60" y="10" width="6" height="20" rx="3" fill="#f43f5e"/>
        <rect x="72" y="0" width="6" height="40" rx="3" fill="#10b981"/>
        <rect x="84" y="6" width="6" height="28" rx="3" fill="#10b981"/>
        <rect x="96" y="14" width="6" height="12" rx="3" fill="#38bdf8"/>
        <rect x="108" y="2" width="6" height="36" rx="3" fill="#38bdf8"/>
        <rect x="120" y="6" width="6" height="28" rx="3" fill="#a855f7"/>
        <rect x="132" y="0" width="6" height="40" rx="3" fill="#a855f7"/>
        <rect x="144" y="10" width="6" height="20" rx="3" fill="#fbbf24"/>
        <rect x="156" y="4" width="6" height="32" rx="3" fill="#fbbf24"/>
        <rect x="168" y="12" width="6" height="16" rx="3" fill="#f97316"/>
        <rect x="180" y="0" width="6" height="40" rx="3" fill="#f97316"/>
        <rect x="192" y="8" width="6" height="24" rx="3" fill="#38bdf8"/>
      </g>

      <!-- Video Progress Scrubber -->
      <rect x="0" y="415" width="220" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
      <rect x="0" y="415" width="140" height="4" rx="2" fill="#f97316"/>
    </g>
  </g>

  <!-- Right Floating Metric Bubble -->
  <g transform="translate(600, 380)" filter="url(#shadow-phone)">
    <rect width="130" height="60" rx="16" fill="#181820" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <text x="20" y="28" font-family="'Anton', sans-serif" font-size="18" fill="#f97316">1.2M+ VIEWS</text>
    <text x="20" y="46" font-family="sans-serif" font-size="10" fill="#9ca3af" font-weight="600">VIRAL RETENTION</text>
  </g>
</svg>
